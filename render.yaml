# Render Blueprint: one free web service. The database lives on Supabase (free, doesn't expire).
# Render dashboard: New → Blueprint → pick this repo → Apply, then paste DATABASE_URL when asked.
services:
  - type: web
    name: ultimate-paddle-tournament
    runtime: node
    plan: free
    region: singapore # same region as the Supabase database
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      # Supabase connection string (Session pooler). Set in the dashboard, never in the repo.
      - key: DATABASE_URL
        sync: false
      # Signs organiser logins. Auto-generated.
      - key: SESSION_SECRET
        generateValue: true
      # Optional: require this code to create new tournaments (stops randoms making their own).
      - key: CREATE_CODE
        sync: false
